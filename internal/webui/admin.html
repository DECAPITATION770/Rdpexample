<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RDP-Tool — Admin</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; margin: 0; background: #1e1e1e; color: #eee; }
  header { padding: 12px 16px; background: #262626; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 15px; margin: 0; flex: 1; }
  button { background: #333; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #3a3a3a; }
  button.primary { background: #2d6cdf; border-color: #2d6cdf; }
  #session-list-view { padding: 16px; max-width: 480px; margin: 0 auto; }
  #sessions { list-style: none; margin: 12px 0; padding: 0; }
  #sessions li { padding: 10px 12px; margin-bottom: 6px; background: #262626; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #sessions li .name { cursor: pointer; flex: 1; }
  #sessions li .name:hover { text-decoration: underline; }
  #sessions li.offline .name { opacity: 0.5; cursor: default; }
  #sessions li .shot-btn { font-size: 12px; padding: 4px 8px; }
  #control-view { display: flex; height: calc(100vh - 49px); }
  #screen-wrap { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: auto; }
  #screen { max-width: 100%; max-height: 100%; cursor: crosshair; }
  #expand-btn { position: absolute; top: 10px; right: 10px; z-index: 5; font-size: 12px; opacity: 0.8; }
  #expand-btn:hover { opacity: 1; }
  #sidebar { width: 260px; padding: 16px; background: #262626; border-left: 1px solid #333; display: flex; flex-direction: column; gap: 16px; }
  /* Expanded mode: the video fills the whole control-view; the sidebar
     becomes a floating translucent overlay instead of a dedicated flex
     column, so the toggles/message form stay reachable without a real
     Fullscreen API hiding them entirely. */
  #control-view.expanded #sidebar { position: fixed; top: 49px; right: 0; bottom: 0; width: 240px; background: rgba(38, 38, 38, 0.88); backdrop-filter: blur(4px); z-index: 10; overflow-y: auto; }
  #screenshot-modal { position: fixed; inset: 0; top: 49px; background: rgba(0, 0, 0, 0.92); z-index: 20; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
  #screenshot-modal img { max-width: 92vw; max-height: 82vh; border-radius: 4px; }
  .toggle-row { display: flex; flex-direction: column; gap: 4px; padding: 10px; background: #1e1e1e; border-radius: 6px; }
  .toggle-row .top { display: flex; justify-content: space-between; align-items: center; }
  .hotkey-label { font-size: 12px; color: #999; }
  .hint { font-size: 11px; color: #777; }
  #msg-text { width: 100%; box-sizing: border-box; padding: 6px; background: #1e1e1e; color: #eee; border: 1px solid #444; border-radius: 4px; }
  #msg-fade { width: 70px; padding: 6px; background: #1e1e1e; color: #eee; border: 1px solid #444; border-radius: 4px; }
  .row { display: flex; align-items: center; gap: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1 id="header-title">RDP-Tool — Sessions</h1>
  <button id="back" hidden>&larr; Back</button>
</header>

<div id="session-list-view">
  <button id="refresh">Refresh</button>
  <ul id="sessions"></ul>
</div>

<div id="screenshot-modal" hidden>
  <img id="screenshot-img" alt="screenshot">
  <button id="screenshot-close">Close</button>
</div>

<div id="control-view" hidden>
  <div id="screen-wrap">
    <button id="expand-btn">⛶ Expand</button>
    <canvas id="screen" width="800" height="600" tabindex="0"></canvas>
  </div>
  <div id="sidebar">
    <div class="toggle-row">
      <div class="top">
        <label><input type="checkbox" id="mouse-toggle"> Mouse</label>
        <button id="mouse-rebind">Rebind</button>
      </div>
      <div class="hotkey-label" id="mouse-hotkey"></div>
    </div>
    <div class="toggle-row">
      <div class="top">
        <label><input type="checkbox" id="kb-toggle"> Keyboard</label>
        <button id="kb-rebind">Rebind</button>
      </div>
      <div class="hotkey-label" id="kb-hotkey"></div>
    </div>
    <div class="toggle-row">
      <div>Message</div>
      <input id="msg-text" type="text" placeholder="text near host's cursor">
      <div class="row">
        <span class="hint">fade, s</span>
        <input id="msg-fade" type="number" step="0.1" min="0.1" value="2.0">
        <button id="msg-send" class="primary">Send</button>
      </div>
    </div>
    <div class="hint">Both toggles start OFF. Click Rebind then press a new key combo to change a hotkey.</div>
  </div>
</div>

<script>
"use strict";

// ---------- Wire protocol (must match internal/proto/messages.go) ----------

const FRAME_INPUT_EVENT = 1;
const FRAME_OVERLAY_MESSAGE = 2;

function encodeFrame(kind, obj) {
  const json = new TextEncoder().encode(JSON.stringify(obj));
  const buf = new ArrayBuffer(5 + json.length);
  new DataView(buf).setUint8(0, kind);
  new DataView(buf).setUint32(1, json.length, false); // big-endian, matches encoding/binary.BigEndian
  new Uint8Array(buf, 5).set(json);
  return buf;
}

// Screen frames don't use the framing above — the host JPEG-encodes its
// capture and splits it into fixed-size chunks (internal/proto's
// EncodeScreenFrameChunks), because a real desktop capture routinely
// exceeds a single WebRTC DataChannel message's size limit (commonly
// ~256KB) even at moderate JPEG quality. Byte 0 being SCREEN_CHUNK_MARKER
// (0xFE) distinguishes a chunk from the [kind][length][JSON] framing
// above, whose kind bytes are always small (1, 2, ...).
const SCREEN_CHUNK_MARKER = 0xFE;
const SCREEN_CHUNK_HEADER_SIZE = 9; // [marker(1)][seq(4)][index(2)][total(2)]

function parseScreenFrameChunk(buf) {
  if (buf.byteLength < SCREEN_CHUNK_HEADER_SIZE) return null;
  const view = new DataView(buf);
  if (view.getUint8(0) !== SCREEN_CHUNK_MARKER) return null;
  return {
    seq: view.getUint32(1, false),
    index: view.getUint16(5, false),
    total: view.getUint16(7, false),
    payload: new Uint8Array(buf, SCREEN_CHUNK_HEADER_SIZE),
  };
}

// Mirrors internal/proto.ScreenFrameReassembler.
class ScreenFrameReassembler {
  constructor() {
    this.seq = null;
    this.total = 0;
    this.got = 0;
    this.parts = [];
  }

  add(seq, index, total, payload) {
    if (this.seq !== seq) {
      this.seq = seq;
      this.total = total;
      this.parts = new Array(total);
      this.got = 0;
    }
    if (index >= this.parts.length || this.parts[index]) return null; // out-of-range or duplicate
    this.parts[index] = payload;
    this.got++;
    if (this.got < this.total) return null;

    let size = 0;
    for (const p of this.parts) size += p.length;
    const out = new Uint8Array(size);
    let offset = 0;
    for (const p of this.parts) { out.set(p, offset); offset += p.length; }
    return out;
  }
}

// JS KeyboardEvent.code -> Windows virtual-key code, for internal/input's
// SendInput wrapper on the host. Covers standard US-layout keys; anything
// missing from this table is silently not forwarded.
const CODE_TO_VK = {};
for (let i = 0; i < 10; i++) CODE_TO_VK["Digit" + i] = 0x30 + i;
for (let c = 0; c < 26; c++) CODE_TO_VK["Key" + String.fromCharCode(65 + c)] = 0x41 + c;
Object.assign(CODE_TO_VK, {
  Backspace: 0x08, Tab: 0x09, Enter: 0x0D, Escape: 0x1B, Space: 0x20,
  PageUp: 0x21, PageDown: 0x22, End: 0x23, Home: 0x24,
  ArrowLeft: 0x25, ArrowUp: 0x26, ArrowRight: 0x27, ArrowDown: 0x28, Delete: 0x2E,
  F1: 0x70, F2: 0x71, F3: 0x72, F4: 0x73, F5: 0x74, F6: 0x75,
  F7: 0x76, F8: 0x77, F9: 0x78, F10: 0x79, F11: 0x7A, F12: 0x7B,
  Semicolon: 0xBA, Equal: 0xBB, Comma: 0xBC, Minus: 0xBD, Period: 0xBE, Slash: 0xBF,
  Backquote: 0xC0, BracketLeft: 0xDB, Backslash: 0xDC, BracketRight: 0xDD, Quote: 0xDE,
});
const MODIFIER_CODES = new Set(["ControlLeft", "ControlRight", "AltLeft", "AltRight", "ShiftLeft", "ShiftRight", "MetaLeft", "MetaRight"]);

// ---------- SignalingClient: one WebSocket to the server's /ws/viewer ----------

class SignalingClient {
  constructor(onSessionList, onAnswer, onScreenshot) {
    const base = location.origin.replace(/^http/, "ws");
    this.ws = new WebSocket(base + "/ws/viewer");
    this.onSessionList = onSessionList;
    this.onAnswer = onAnswer;
    this.onScreenshot = onScreenshot;
    this.ws.onmessage = (ev) => this._handle(JSON.parse(ev.data));
  }

  _handle(env) {
    if (env.type === "session_list") this.onSessionList(env.payload.sessions || []);
    else if (env.type === "answer") this.onAnswer(env.payload.sdp);
    else if (env.type === "screenshot") this.onScreenshot(env.payload.jpeg);
    // ice_candidate is unused: both sides wait for full ICE gathering
    // before exchanging SDP (non-trickle), so candidates already ride
    // along inside the offer/answer SDP itself.
  }

  requestSessionList() {
    this.ws.send(JSON.stringify({ type: "list_sessions" }));
  }

  sendOffer(sessionId, sdp) {
    this.ws.send(JSON.stringify({ type: "offer", session_id: sessionId, payload: { sdp } }));
  }

  // requestScreenshot asks the host for a single one-off preview JPEG —
  // no WebRTC session involved, just this WebSocket. Fine for a quick
  // "what's on that screen right now" peek from the session list.
  requestScreenshot(sessionId) {
    this.ws.send(JSON.stringify({ type: "request_screenshot", session_id: sessionId }));
  }
}

// ---------- ICE server config, fetched once from the server ----------

let iceServersPromise = null;
function fetchIceServers() {
  if (!iceServersPromise) {
    iceServersPromise = fetch("/config")
      .then((r) => r.json())
      .then((cfg) => cfg.iceServers || [])
      .catch((e) => { console.error("failed to fetch /config:", e); return []; });
  }
  return iceServersPromise;
}

// ---------- RemoteSession: one WebRTC PeerConnection to a host ----------

// RemoteSession opens two DataChannels, matching internal/webrtcconn.Peer
// on the host side: "control" (ordered/reliable — mouse/keyboard/overlay
// messages) and "video" (unordered, zero-retransmit — screen frame
// chunks). Putting video on its own unreliable channel matters: an
// ordered channel delivers strictly in send order, so a multi-chunk
// video frame in flight would otherwise force every queued mouse-move or
// keypress to wait behind it — that head-of-line blocking is what made
// mouse control feel laggy before this split existed.
class RemoteSession {
  constructor(signaling, session, onScreenFrame, iceServers) {
    this.signaling = signaling;
    this.session = session;
    this.onScreenFrame = onScreenFrame;
    this.reassembler = new ScreenFrameReassembler();
    this.pc = new RTCPeerConnection({ iceServers: iceServers || [] });

    this.dcControl = this.pc.createDataChannel("control");
    this.dcControl.binaryType = "arraybuffer";

    this.dcVideo = this.pc.createDataChannel("video", { ordered: false, maxRetransmits: 0 });
    this.dcVideo.binaryType = "arraybuffer";
    this.dcVideo.onmessage = (ev) => {
      const chunk = parseScreenFrameChunk(ev.data);
      if (!chunk) return;
      const complete = this.reassembler.add(chunk.seq, chunk.index, chunk.total, chunk.payload);
      if (complete) this.onScreenFrame(complete);
    };
  }

  async connect() {
    const offer = await this.pc.createOffer();
    await this.pc.setLocalDescription(offer);
    await this._waitIceGatheringComplete();
    this.signaling.sendOffer(this.session.session_id, this.pc.localDescription.sdp);
  }

  async acceptAnswer(sdp) {
    await this.pc.setRemoteDescription({ type: "answer", sdp });
  }

  _waitIceGatheringComplete() {
    if (this.pc.iceGatheringState === "complete") return Promise.resolve();
    return new Promise((resolve) => {
      const check = () => {
        if (this.pc.iceGatheringState === "complete") {
          this.pc.removeEventListener("icegatheringstatechange", check);
          resolve();
        }
      };
      this.pc.addEventListener("icegatheringstatechange", check);
    });
  }

  send(kind, obj) {
    if (this.dcControl.readyState === "open") this.dcControl.send(encodeFrame(kind, obj));
  }

  close() {
    this.dcControl.close();
    this.dcVideo.close();
    this.pc.close();
  }
}

// ---------- Hotkey combo persistence (localStorage) ----------

function loadCombo(key, def) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignore malformed storage */ }
  return def;
}
function saveCombo(key, combo) { localStorage.setItem(key, JSON.stringify(combo)); }
function comboFromEvent(e) { return { ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey, code: e.code }; }
function comboEquals(a, b) { return a.ctrl === b.ctrl && a.alt === b.alt && a.shift === b.shift && a.code === b.code; }
function comboLabel(c) {
  const parts = [];
  if (c.ctrl) parts.push("Ctrl");
  if (c.alt) parts.push("Alt");
  if (c.shift) parts.push("Shift");
  parts.push(c.code.replace(/^Key|^Digit/, ""));
  return parts.join("+");
}

// ---------- App state + UI wiring ----------

const els = {
  headerTitle: document.getElementById("header-title"),
  back: document.getElementById("back"),
  listView: document.getElementById("session-list-view"),
  controlView: document.getElementById("control-view"),
  sessions: document.getElementById("sessions"),
  refresh: document.getElementById("refresh"),
  screen: document.getElementById("screen"),
  mouseToggle: document.getElementById("mouse-toggle"),
  mouseRebind: document.getElementById("mouse-rebind"),
  mouseHotkey: document.getElementById("mouse-hotkey"),
  kbToggle: document.getElementById("kb-toggle"),
  kbRebind: document.getElementById("kb-rebind"),
  kbHotkey: document.getElementById("kb-hotkey"),
  msgText: document.getElementById("msg-text"),
  msgFade: document.getElementById("msg-fade"),
  msgSend: document.getElementById("msg-send"),
  expandBtn: document.getElementById("expand-btn"),
  screenshotModal: document.getElementById("screenshot-modal"),
  screenshotImg: document.getElementById("screenshot-img"),
  screenshotClose: document.getElementById("screenshot-close"),
};

let sessions = [];
let mouseCombo = loadCombo("rdp.mouseCombo", { ctrl: true, alt: true, shift: false, code: "KeyM" });
let kbCombo = loadCombo("rdp.kbCombo", { ctrl: true, alt: true, shift: false, code: "KeyK" });
let rebinding = null; // "mouse" | "keyboard" | null
let remote = null; // active RemoteSession

function updateHotkeyLabels() {
  els.mouseHotkey.textContent = mouseCombo ? comboLabel(mouseCombo) : "";
  els.kbHotkey.textContent = kbCombo ? comboLabel(kbCombo) : "";
}
updateHotkeyLabels();

const signaling = new SignalingClient(
  (list) => { sessions = list; renderSessions(); },
  (sdp) => { if (remote) remote.acceptAnswer(sdp); },
  (jpegBase64) => showScreenshotModal(jpegBase64)
);

function renderSessions() {
  els.sessions.innerHTML = "";
  for (const s of sessions) {
    const li = document.createElement("li");
    if (!s.online) li.classList.add("offline");

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = (s.online ? "\u{1F7E2} " : "⚪ ") + s.name;
    if (s.online) name.addEventListener("click", () => openSession(s));
    li.appendChild(name);

    if (s.online) {
      const shotBtn = document.createElement("button");
      shotBtn.className = "shot-btn";
      shotBtn.textContent = "Screenshot";
      shotBtn.addEventListener("click", () => signaling.requestScreenshot(s.session_id));
      li.appendChild(shotBtn);
    }

    els.sessions.appendChild(li);
  }
}

// showScreenshotModal displays a one-off preview JPEG (from
// requestScreenshot, no WebRTC involved) large within the page — not via
// the real Fullscreen API, so the close button and rest of the page
// chrome stay reachable.
function showScreenshotModal(jpegBase64) {
  els.screenshotImg.src = "data:image/jpeg;base64," + jpegBase64;
  els.screenshotModal.hidden = false;
}
els.screenshotClose.addEventListener("click", () => { els.screenshotModal.hidden = true; });

// Expand toggles the live control-window video to fill the available
// space; the sidebar (toggles + message form) becomes a floating
// translucent overlay instead of disappearing, unlike the browser's
// real Fullscreen API which would hide it entirely.
els.expandBtn.addEventListener("click", () => {
  const expanded = els.controlView.classList.toggle("expanded");
  els.expandBtn.textContent = expanded ? "⛶ Collapse" : "⛶ Expand";
});

els.refresh.addEventListener("click", () => signaling.requestSessionList());
signaling.ws.addEventListener("open", () => signaling.requestSessionList());

async function openSession(session) {
  els.headerTitle.textContent = session.name;
  els.back.hidden = false;
  els.listView.hidden = true;
  els.controlView.hidden = false;
  els.mouseToggle.checked = false;
  els.kbToggle.checked = false;

  const iceServers = await fetchIceServers();
  remote = new RemoteSession(signaling, session, renderScreenFrame, iceServers);
  remote.connect();
}

els.back.addEventListener("click", () => {
  if (remote) { remote.close(); remote = null; }
  els.back.hidden = true;
  els.listView.hidden = false;
  els.controlView.hidden = true;
  els.controlView.classList.remove("expanded");
  els.expandBtn.textContent = "⛶ Expand";
  els.headerTitle.textContent = "RDP-Tool — Sessions";
});

// renderScreenFrame takes the raw reassembled JPEG bytes (a Uint8Array,
// not base64 — chunking sends the bytes directly, no JSON/base64
// overhead) and draws them onto the canvas.
function renderScreenFrame(jpegBytes) {
  const url = URL.createObjectURL(new Blob([jpegBytes], { type: "image/jpeg" }));
  const img = new Image();
  img.onload = () => {
    if (els.screen.width !== img.width || els.screen.height !== img.height) {
      els.screen.width = img.width;
      els.screen.height = img.height;
    }
    els.screen.getContext("2d").drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
  };
  img.onerror = () => URL.revokeObjectURL(url);
  img.src = url;
}

// ---------- Mouse control ----------

els.mouseToggle.addEventListener("change", () => { /* checkbox is the source of truth, read directly */ });

els.screen.addEventListener("mousemove", (e) => {
  if (!els.mouseToggle.checked || !remote) return;
  const rect = els.screen.getBoundingClientRect();
  const x = Math.round(((e.clientX - rect.left) / rect.width) * els.screen.width);
  const y = Math.round(((e.clientY - rect.top) / rect.height) * els.screen.height);
  remote.send(FRAME_INPUT_EVENT, { kind: "mouse_move", x, y });
});
els.screen.addEventListener("mousedown", () => {
  if (!els.mouseToggle.checked || !remote) return;
  remote.send(FRAME_INPUT_EVENT, { kind: "mouse_down" });
});
els.screen.addEventListener("mouseup", () => {
  if (!els.mouseToggle.checked || !remote) return;
  remote.send(FRAME_INPUT_EVENT, { kind: "mouse_up" });
});
els.screen.addEventListener("contextmenu", (e) => e.preventDefault());

// ---------- Keyboard control + hotkeys + rebind ----------

els.mouseRebind.addEventListener("click", () => { rebinding = "mouse"; els.mouseRebind.textContent = "Press keys..."; });
els.kbRebind.addEventListener("click", () => { rebinding = "keyboard"; els.kbRebind.textContent = "Press keys..."; });

function isTypingTarget(el) {
  return el && (el.id === "msg-text" || el.id === "msg-fade");
}

document.addEventListener("keydown", (e) => {
  if (rebinding) {
    if (MODIFIER_CODES.has(e.code)) return; // wait for a real, non-modifier key
    e.preventDefault();
    const combo = comboFromEvent(e);
    if (rebinding === "mouse") { mouseCombo = combo; saveCombo("rdp.mouseCombo", combo); els.mouseRebind.textContent = "Rebind"; }
    else { kbCombo = combo; saveCombo("rdp.kbCombo", combo); els.kbRebind.textContent = "Rebind"; }
    updateHotkeyLabels();
    rebinding = null;
    return;
  }

  if (isTypingTarget(document.activeElement)) return;

  const combo = comboFromEvent(e);
  if (!MODIFIER_CODES.has(e.code) && comboEquals(combo, mouseCombo)) {
    e.preventDefault();
    els.mouseToggle.checked = !els.mouseToggle.checked;
    return;
  }
  if (!MODIFIER_CODES.has(e.code) && comboEquals(combo, kbCombo)) {
    e.preventDefault();
    els.kbToggle.checked = !els.kbToggle.checked;
    return;
  }

  if (els.kbToggle.checked && remote) {
    const vk = CODE_TO_VK[e.code];
    if (vk) {
      e.preventDefault();
      remote.send(FRAME_INPUT_EVENT, { kind: "key_down", key_vk: vk });
    }
  }
});

document.addEventListener("keyup", (e) => {
  if (rebinding || isTypingTarget(document.activeElement)) return;
  if (els.kbToggle.checked && remote) {
    const vk = CODE_TO_VK[e.code];
    if (vk) remote.send(FRAME_INPUT_EVENT, { kind: "key_up", key_vk: vk });
  }
});

// ---------- Overlay message ----------

els.msgSend.addEventListener("click", () => {
  if (!remote) return;
  const text = els.msgText.value;
  if (!text) return;
  let fade = parseFloat(els.msgFade.value);
  if (isNaN(fade) || fade <= 0) fade = 2.0;
  fade = Math.round(fade * 10) / 10;
  remote.send(FRAME_OVERLAY_MESSAGE, { text, fade_seconds: fade });
  els.msgText.value = "";
});
</script>
</body>
</html>
