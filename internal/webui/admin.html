<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RDP-Tool — Admin</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; margin: 0; background: #1e1e1e; color: #eee; }
  header { padding: 12px 16px; background: #262626; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 15px; margin: 0; flex: 1; }
  button { background: #333; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #3a3a3a; }
  button.primary { background: #2d6cdf; border-color: #2d6cdf; }
  #session-list-view { padding: 16px; max-width: 480px; margin: 0 auto; }
  #sessions { list-style: none; margin: 12px 0; padding: 0; }
  #sessions li { padding: 10px 12px; margin-bottom: 6px; background: #262626; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #sessions li .name { cursor: pointer; flex: 1; }
  #sessions li .name:hover { text-decoration: underline; }
  #sessions li.offline .name { opacity: 0.5; cursor: default; }
  #control-view { display: flex; height: calc(100vh - 49px); }
  #screen-wrap { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: auto; }
  #screen { max-width: 100%; max-height: 100%; cursor: crosshair; }
  #screen-http { max-width: 100%; max-height: 100%; cursor: crosshair; -webkit-user-drag: none; user-select: none; }
  #toolbar { position: absolute; top: 10px; right: 10px; z-index: 5; display: flex; align-items: center; gap: 6px; }
  #toolbar button { font-size: 12px; opacity: 0.8; }
  #toolbar button:hover { opacity: 1; }
  #status-badge { font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #333; }
  #status-badge.live { background: #1e5c2e; }
  #status-badge.failed { background: #6b1e1e; }
  #sidebar { width: 260px; padding: 16px; background: #262626; border-left: 1px solid #333; display: flex; flex-direction: column; gap: 16px; }
  /* Expanded mode: the video fills the whole control-view; the sidebar
     becomes a floating translucent overlay instead of a dedicated flex
     column, so the toggles/message form stay reachable without a real
     Fullscreen API hiding them entirely. It stays off-screen (slid past
     the right edge) until hovered — either directly, or via the thin
     invisible strip along the edge that catches the mouse before it
     reaches the sidebar itself — so the video isn't permanently
     obstructed while expanded. */
  #control-view.expanded #sidebar { position: fixed; top: 49px; right: 0; bottom: 0; width: 240px; background: rgba(38, 38, 38, 0.88); backdrop-filter: blur(4px); z-index: 10; overflow-y: auto; transform: translateX(100%); transition: transform 0.18s ease; }
  #control-view.expanded #sidebar.revealed { transform: translateX(0); }
  #sidebar-hover-zone { display: none; }
  #control-view.expanded #sidebar-hover-zone { display: block; position: fixed; top: 49px; right: 0; bottom: 0; width: 14px; z-index: 9; }
  #screenshot-modal { position: fixed; inset: 0; top: 49px; background: rgba(0, 0, 0, 0.92); z-index: 20; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
  #screenshot-modal img { max-width: 92vw; max-height: 82vh; border-radius: 4px; }
  .toggle-row { display: flex; flex-direction: column; gap: 4px; padding: 10px; background: #1e1e1e; border-radius: 6px; }
  .toggle-row .top { display: flex; justify-content: space-between; align-items: center; }
  .hotkey-label { font-size: 12px; color: #999; }
  .hint { font-size: 11px; color: #777; }
  #msg-text { width: 100%; box-sizing: border-box; padding: 6px; background: #1e1e1e; color: #eee; border: 1px solid #444; border-radius: 4px; }
  #msg-fade { width: 70px; padding: 6px; background: #1e1e1e; color: #eee; border: 1px solid #444; border-radius: 4px; }
  #msg-color { width: 32px; height: 28px; padding: 2px; background: #1e1e1e; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
  .row { display: flex; align-items: center; gap: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1 id="header-title">RDP-Tool — Sessions</h1>
  <button id="back" hidden>&larr; Back</button>
</header>

<div id="session-list-view">
  <button id="refresh">Refresh</button>
  <ul id="sessions"></ul>
</div>

<div id="screenshot-modal" hidden>
  <img id="screenshot-img" alt="screenshot">
  <button id="screenshot-close">Close</button>
</div>

<div id="control-view" hidden>
  <div id="screen-wrap">
    <div id="toolbar">
      <span id="status-badge">connecting…</span>
      <button id="transport-toggle" title="Switch between WebRTC and HTTP">⇄ HTTP</button>
      <button id="shot-btn" title="Grab a one-off screenshot">📷</button>
      <button id="expand-btn">⛶ Expand</button>
    </div>
    <canvas id="screen" width="800" height="600" tabindex="0"></canvas>
    <img id="screen-http" hidden alt="live view (HTTP)" draggable="false">
  </div>
  <div id="sidebar-hover-zone"></div>
  <div id="sidebar">
    <div class="toggle-row">
      <div class="top">
        <label><input type="checkbox" id="mouse-toggle"> Mouse</label>
        <button id="mouse-rebind">Rebind</button>
      </div>
      <div class="hotkey-label" id="mouse-hotkey"></div>
    </div>
    <div class="toggle-row">
      <div class="top">
        <label><input type="checkbox" id="kb-toggle"> Keyboard</label>
        <button id="kb-rebind">Rebind</button>
      </div>
      <div class="hotkey-label" id="kb-hotkey"></div>
    </div>
    <div class="toggle-row">
      <div>Message</div>
      <input id="msg-text" type="text" placeholder="text near host's cursor">
      <div class="row">
        <input id="msg-color" type="color" value="#ffffff" title="text color">
        <span class="hint">fade, s</span>
        <input id="msg-fade" type="number" step="0.1" min="0.1" value="2.0">
        <button id="msg-send" class="primary">Send</button>
      </div>
    </div>
    <div class="hint">Both toggles start OFF. Click Rebind then press a new key combo to change a hotkey.</div>
  </div>
</div>

<script>
"use strict";

// ---------- Wire protocol (must match internal/proto/messages.go) ----------

const FRAME_INPUT_EVENT = 1;
const FRAME_OVERLAY_MESSAGE = 2;

function encodeFrame(kind, obj) {
  const json = new TextEncoder().encode(JSON.stringify(obj));
  const buf = new ArrayBuffer(5 + json.length);
  new DataView(buf).setUint8(0, kind);
  new DataView(buf).setUint32(1, json.length, false); // big-endian, matches encoding/binary.BigEndian
  new Uint8Array(buf, 5).set(json);
  return buf;
}

// Screen frames don't use the framing above — the host JPEG-encodes its
// capture and splits it into fixed-size chunks (internal/proto's
// EncodeScreenFrameChunks), because a real desktop capture routinely
// exceeds a single WebRTC DataChannel message's size limit (commonly
// ~256KB) even at moderate JPEG quality. Byte 0 being SCREEN_CHUNK_MARKER
// (0xFE) distinguishes a chunk from the [kind][length][JSON] framing
// above, whose kind bytes are always small (1, 2, ...).
const SCREEN_CHUNK_MARKER = 0xFE;
const SCREEN_CHUNK_HEADER_SIZE = 9; // [marker(1)][seq(4)][index(2)][total(2)]

function parseScreenFrameChunk(buf) {
  if (buf.byteLength < SCREEN_CHUNK_HEADER_SIZE) return null;
  const view = new DataView(buf);
  if (view.getUint8(0) !== SCREEN_CHUNK_MARKER) return null;
  return {
    seq: view.getUint32(1, false),
    index: view.getUint16(5, false),
    total: view.getUint16(7, false),
    payload: new Uint8Array(buf, SCREEN_CHUNK_HEADER_SIZE),
  };
}

// Mirrors internal/proto.ScreenFrameReassembler.
class ScreenFrameReassembler {
  constructor() {
    this.seq = null;
    this.total = 0;
    this.got = 0;
    this.parts = [];
  }

  add(seq, index, total, payload) {
    if (this.seq !== seq) {
      this.seq = seq;
      this.total = total;
      this.parts = new Array(total);
      this.got = 0;
    }
    if (index >= this.parts.length || this.parts[index]) return null; // out-of-range or duplicate
    this.parts[index] = payload;
    this.got++;
    if (this.got < this.total) return null;

    let size = 0;
    for (const p of this.parts) size += p.length;
    const out = new Uint8Array(size);
    let offset = 0;
    for (const p of this.parts) { out.set(p, offset); offset += p.length; }
    return out;
  }
}

// JS KeyboardEvent.code -> Windows virtual-key code, for internal/input's
// SendInput wrapper on the host. Covers standard US-layout keys; anything
// missing from this table is silently not forwarded.
const CODE_TO_VK = {};
for (let i = 0; i < 10; i++) CODE_TO_VK["Digit" + i] = 0x30 + i;
for (let c = 0; c < 26; c++) CODE_TO_VK["Key" + String.fromCharCode(65 + c)] = 0x41 + c;
Object.assign(CODE_TO_VK, {
  Backspace: 0x08, Tab: 0x09, Enter: 0x0D, Escape: 0x1B, Space: 0x20,
  PageUp: 0x21, PageDown: 0x22, End: 0x23, Home: 0x24,
  ArrowLeft: 0x25, ArrowUp: 0x26, ArrowRight: 0x27, ArrowDown: 0x28, Delete: 0x2E,
  F1: 0x70, F2: 0x71, F3: 0x72, F4: 0x73, F5: 0x74, F6: 0x75,
  F7: 0x76, F8: 0x77, F9: 0x78, F10: 0x79, F11: 0x7A, F12: 0x7B,
  Semicolon: 0xBA, Equal: 0xBB, Comma: 0xBC, Minus: 0xBD, Period: 0xBE, Slash: 0xBF,
  Backquote: 0xC0, BracketLeft: 0xDB, Backslash: 0xDC, BracketRight: 0xDD, Quote: 0xDE,
});
const MODIFIER_CODES = new Set(["ControlLeft", "ControlRight", "AltLeft", "AltRight", "ShiftLeft", "ShiftRight", "MetaLeft", "MetaRight"]);

// ---------- SignalingClient: one WebSocket to the server's /ws/viewer ----------

class SignalingClient {
  constructor(onSessionList, onAnswer, onScreenshot) {
    this.base = location.origin.replace(/^http/, "ws");
    this.onSessionList = onSessionList;
    this.onAnswer = onAnswer;
    this.onScreenshot = onScreenshot;
    this.onReady = null; // called on every (re)connect once the socket is open
    this.onDisconnect = null; // called when an open socket drops
    this._backoff = 500; // ms; grows to _maxBackoff on repeated failures
    this._maxBackoff = 5000;
    this._reconnectTimer = null;
    this._connect();
  }

  // _connect opens the viewer WebSocket and, crucially, reopens it after
  // any drop. Without this a transient network change — Wi-Fi handover, a
  // VPN reconnecting, the laptop sleeping — permanently killed the whole
  // UI: the socket closed and was never recreated, so the session list,
  // HTTP-fallback input, and any hope of reconnecting all went dead until
  // a manual page reload. The host side already retries forever; this is
  // the browser side finally matching it.
  _connect() {
    const ws = new WebSocket(this.base + "/ws/viewer");
    this.ws = ws;
    ws.onmessage = (ev) => this._handle(JSON.parse(ev.data));
    ws.onopen = () => {
      this._backoff = 500; // reset on a successful connect
      if (this.onReady) this.onReady();
    };
    ws.onclose = () => {
      if (this.onDisconnect) this.onDisconnect();
      this._scheduleReconnect();
    };
    // An errored socket also fires close; let onclose drive the reconnect
    // so we don't schedule it twice.
    ws.onerror = () => {};
  }

  _scheduleReconnect() {
    clearTimeout(this._reconnectTimer);
    const delay = this._backoff;
    this._backoff = Math.min(this._backoff * 2, this._maxBackoff);
    this._reconnectTimer = setTimeout(() => this._connect(), delay);
  }

  _handle(env) {
    if (env.type === "session_list") this.onSessionList(env.payload.sessions || []);
    else if (env.type === "answer") this.onAnswer(env.payload.sdp);
    else if (env.type === "screenshot") this.onScreenshot(env.payload.jpeg);
    // ice_candidate is unused: both sides wait for full ICE gathering
    // before exchanging SDP (non-trickle), so candidates already ride
    // along inside the offer/answer SDP itself.
  }

  // _send drops the message if the socket isn't open (mid-reconnect),
  // rather than throwing. Input events and list refreshes are fine to
  // lose during a blip — the next ones arrive once the socket is back —
  // and this keeps a stray send from throwing an uncaught exception while
  // reconnecting.
  _send(obj) {
    if (this.ws.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify(obj));
  }

  requestSessionList() {
    this._send({ type: "list_sessions" });
  }

  sendOffer(sessionId, sdp) {
    this._send({ type: "offer", session_id: sessionId, payload: { sdp } });
  }

  // requestScreenshot asks the host for a single one-off preview JPEG —
  // no WebRTC session involved, just this WebSocket. Fine for a quick
  // "what's on that screen right now" peek from the session list.
  requestScreenshot(sessionId) {
    this._send({ type: "request_screenshot", session_id: sessionId });
  }

  // sendInputEvent/sendOverlayMessage carry mouse/keyboard/overlay
  // messages over the signaling WebSocket instead of a WebRTC
  // DataChannel — used by the HTTP/MJPEG fallback transport, which has
  // no PeerConnection at all.
  sendInputEvent(sessionId, evt) {
    this._send({ type: "input_event", session_id: sessionId, payload: evt });
  }

  sendOverlayMessage(sessionId, msg) {
    this._send({ type: "overlay_message", session_id: sessionId, payload: msg });
  }
}

// ---------- ICE server config, fetched once from the server ----------

let iceServersPromise = null;
function fetchIceServers() {
  if (!iceServersPromise) {
    iceServersPromise = fetch("/config")
      .then((r) => r.json())
      .then((cfg) => cfg.iceServers || [])
      .catch((e) => { console.error("failed to fetch /config:", e); return []; });
  }
  return iceServersPromise;
}

// ---------- RemoteSession: one WebRTC PeerConnection to a host ----------

// RemoteSession opens two DataChannels, matching internal/webrtcconn.Peer
// on the host side: "control" (ordered/reliable — mouse/keyboard/overlay
// messages) and "video" (unordered, zero-retransmit — screen frame
// chunks). Putting video on its own unreliable channel matters: an
// ordered channel delivers strictly in send order, so a multi-chunk
// video frame in flight would otherwise force every queued mouse-move or
// keypress to wait behind it — that head-of-line blocking is what made
// mouse control feel laggy before this split existed.
class RemoteSession {
  constructor(signaling, session, onScreenFrame, iceServers) {
    this.signaling = signaling;
    this.session = session;
    this.onScreenFrame = onScreenFrame;
    this.onConnectionLost = null; // set by the caller to drive recovery
    this._lost = false;
    this.reassembler = new ScreenFrameReassembler();
    this.pc = new RTCPeerConnection({ iceServers: iceServers || [] });

    // A PeerConnection does not heal itself after the network moves under
    // it (VPN reconnect, Wi-Fi handover): ICE goes to "failed"/"closed"
    // and stays there, with no more video, forever. Detect that and hand
    // control back to the caller to rebuild the session, firing at most
    // once per RemoteSession so a flurry of state changes can't kick off
    // multiple overlapping reconnects.
    this.pc.onconnectionstatechange = () => {
      const st = this.pc.connectionState;
      if ((st === "failed" || st === "disconnected" || st === "closed") && !this._lost) {
        this._lost = true;
        if (this.onConnectionLost) this.onConnectionLost();
      }
    };

    this.dcControl = this.pc.createDataChannel("control");
    this.dcControl.binaryType = "arraybuffer";

    this.dcVideo = this.pc.createDataChannel("video", { ordered: false, maxRetransmits: 0 });
    this.dcVideo.binaryType = "arraybuffer";
    this.dcVideo.onmessage = (ev) => {
      const chunk = parseScreenFrameChunk(ev.data);
      if (!chunk) return;
      const complete = this.reassembler.add(chunk.seq, chunk.index, chunk.total, chunk.payload);
      if (complete) this.onScreenFrame(complete);
    };
  }

  async connect() {
    const offer = await this.pc.createOffer();
    await this.pc.setLocalDescription(offer);
    await this._waitIceGatheringComplete();
    this.signaling.sendOffer(this.session.session_id, this.pc.localDescription.sdp);
  }

  async acceptAnswer(sdp) {
    await this.pc.setRemoteDescription({ type: "answer", sdp });
  }

  _waitIceGatheringComplete() {
    if (this.pc.iceGatheringState === "complete") return Promise.resolve();
    return new Promise((resolve) => {
      const check = () => {
        if (this.pc.iceGatheringState === "complete") {
          this.pc.removeEventListener("icegatheringstatechange", check);
          resolve();
        }
      };
      this.pc.addEventListener("icegatheringstatechange", check);
    });
  }

  send(kind, obj) {
    if (this.dcControl.readyState === "open") this.dcControl.send(encodeFrame(kind, obj));
  }

  close() {
    // Mark lost first so pc.close()'s "closed" state change doesn't fire
    // onConnectionLost — a deliberate close must never trigger recovery.
    this._lost = true;
    this.dcControl.close();
    this.dcVideo.close();
    this.pc.close();
  }
}

// ---------- Hotkey combo persistence (localStorage) ----------

function loadCombo(key, def) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignore malformed storage */ }
  return def;
}
function saveCombo(key, combo) { localStorage.setItem(key, JSON.stringify(combo)); }
function comboFromEvent(e) { return { ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey, code: e.code }; }
function comboEquals(a, b) { return a.ctrl === b.ctrl && a.alt === b.alt && a.shift === b.shift && a.code === b.code; }
function comboLabel(c) {
  const parts = [];
  if (c.ctrl) parts.push("Ctrl");
  if (c.alt) parts.push("Alt");
  if (c.shift) parts.push("Shift");
  parts.push(c.code.replace(/^Key|^Digit/, ""));
  return parts.join("+");
}

// ---------- App state + UI wiring ----------

const els = {
  headerTitle: document.getElementById("header-title"),
  back: document.getElementById("back"),
  listView: document.getElementById("session-list-view"),
  controlView: document.getElementById("control-view"),
  sessions: document.getElementById("sessions"),
  refresh: document.getElementById("refresh"),
  screen: document.getElementById("screen"),
  screenHttp: document.getElementById("screen-http"),
  transportToggle: document.getElementById("transport-toggle"),
  mouseToggle: document.getElementById("mouse-toggle"),
  mouseRebind: document.getElementById("mouse-rebind"),
  mouseHotkey: document.getElementById("mouse-hotkey"),
  kbToggle: document.getElementById("kb-toggle"),
  kbRebind: document.getElementById("kb-rebind"),
  kbHotkey: document.getElementById("kb-hotkey"),
  msgText: document.getElementById("msg-text"),
  msgColor: document.getElementById("msg-color"),
  msgFade: document.getElementById("msg-fade"),
  msgSend: document.getElementById("msg-send"),
  expandBtn: document.getElementById("expand-btn"),
  sidebar: document.getElementById("sidebar"),
  sidebarHoverZone: document.getElementById("sidebar-hover-zone"),
  shotBtn: document.getElementById("shot-btn"),
  statusBadge: document.getElementById("status-badge"),
  screenshotModal: document.getElementById("screenshot-modal"),
  screenshotImg: document.getElementById("screenshot-img"),
  screenshotClose: document.getElementById("screenshot-close"),
};

let sessions = [];
let mouseCombo = loadCombo("rdp.mouseCombo", { ctrl: true, alt: true, shift: false, code: "KeyM" });
let kbCombo = loadCombo("rdp.kbCombo", { ctrl: true, alt: true, shift: false, code: "KeyK" });
let rebinding = null; // "mouse" | "keyboard" | null
let remote = null; // active RemoteSession
let currentSession = null; // session_id of the currently open session, if any

// ---------- Connect-timeout / status badge (WebRTC path) ----------

// If no video frame arrives within this long after opening a session, the
// black canvas is almost certainly a dead connection (ICE stuck, TURN
// unreachable, host never answered) rather than a slow first frame — flag
// it instead of leaving the viewer staring at an unexplained black screen.
const WEBRTC_CONNECT_TIMEOUT_MS = 6000;
let gotFirstFrame = false;
let connectTimeoutHandle = null;

function setStatus(text, cls) {
  els.statusBadge.textContent = text;
  els.statusBadge.className = cls || "";
}

// ---------- Transport switch (WebRTC <-> HTTP/MJPEG fallback) ----------

let transportMode = "webrtc"; // "webrtc" | "http"
let transportGeneration = 0;

function activeSurfaceEl() {
  return transportMode === "http" ? els.screenHttp : els.screen;
}

function activeSurfaceSize() {
  const el = activeSurfaceEl();
  return transportMode === "http"
    ? { width: el.naturalWidth, height: el.naturalHeight }
    : { width: el.width, height: el.height };
}

// sendInput dispatches a mouse/keyboard event over whichever transport is
// currently active: the WebRTC control DataChannel, or (in HTTP fallback
// mode, where there's no PeerConnection at all) the signaling WebSocket.
function sendInput(kind, obj) {
  if (!currentSession) return;
  if (transportMode === "webrtc") {
    if (remote) remote.send(FRAME_INPUT_EVENT, { kind, ...obj });
  } else {
    signaling.sendInputEvent(currentSession.session_id, { kind, ...obj });
  }
}

function updateHotkeyLabels() {
  els.mouseHotkey.textContent = mouseCombo ? comboLabel(mouseCombo) : "";
  els.kbHotkey.textContent = kbCombo ? comboLabel(kbCombo) : "";
}
updateHotkeyLabels();

const signaling = new SignalingClient(
  (list) => { sessions = list; renderSessions(); },
  (sdp) => { if (remote) remote.acceptAnswer(sdp); },
  (jpegBase64) => showScreenshotModal(jpegBase64)
);

// On every (re)connect of the signaling socket, refresh the session list
// and — if a session is open — rebuild it. A reconnect almost always
// means the network just changed (VPN, Wi-Fi, sleep), which is exactly
// what leaves a stale WebRTC PeerConnection or a stalled MJPEG stream, so
// rebuilding is the right default rather than assuming the old transport
// survived.
signaling.onReady = () => {
  signaling.requestSessionList();
  if (currentSession) reconnectActiveSession();
};
signaling.onDisconnect = () => {
  if (currentSession) setStatus("⚠ соединение потеряно, переподключение…", "failed");
};

// reconnectActiveSession rebuilds whichever transport the open session is
// using. Safe to call more than once (e.g. both the socket reopening and
// the PeerConnection reporting failure can trigger it): connectWebRTC's
// generation guard invalidates any older in-flight attempt, and closing
// the previous RemoteSession first prevents a leak.
function reconnectActiveSession() {
  if (!currentSession) return;
  if (transportMode === "http") {
    // Cache-bust so the browser actually reopens the stream instead of
    // reusing the dead connection.
    els.screenHttp.src = "/stream/" + currentSession.session_id + "?t=" + Date.now();
    setStatus("🟠 HTTP relay", "");
    return;
  }
  if (remote) { remote.close(); remote = null; }
  connectWebRTC();
}

function renderSessions() {
  els.sessions.innerHTML = "";
  for (const s of sessions) {
    const li = document.createElement("li");
    if (!s.online) li.classList.add("offline");

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = (s.online ? "\u{1F7E2} " : "⚪ ") + s.name;
    if (s.online) name.addEventListener("click", () => openSession(s));
    li.appendChild(name);

    els.sessions.appendChild(li);
  }
}

// showScreenshotModal displays a one-off preview JPEG (from
// requestScreenshot, no WebRTC involved) large within the page — not via
// the real Fullscreen API, so the close button and rest of the page
// chrome stay reachable.
function showScreenshotModal(jpegBase64) {
  els.screenshotImg.src = "data:image/jpeg;base64," + jpegBase64;
  els.screenshotModal.hidden = false;
}
els.screenshotClose.addEventListener("click", () => { els.screenshotModal.hidden = true; });

// Expand toggles the live control-window video to fill the available
// space; the sidebar (toggles + message form) becomes a floating
// translucent overlay instead of disappearing, unlike the browser's
// real Fullscreen API which would hide it entirely.
els.expandBtn.addEventListener("click", () => {
  const expanded = els.controlView.classList.toggle("expanded");
  els.expandBtn.textContent = expanded ? "⛶ Collapse" : "⛶ Expand";
  els.sidebar.classList.remove("revealed"); // start hidden either way; hover reveals it
});

// In expanded mode the sidebar auto-hides until the mouse is near the
// right edge: the hover zone is a thin strip that catches the pointer
// before it reaches the sidebar itself (so there's no dead gap the
// mouse has to cross), and the sidebar re-hides shortly after the mouse
// leaves both the zone and the sidebar (a short delay so moving from
// the zone into the sidebar doesn't cause a flicker).
let sidebarHideTimeout = null;
function revealSidebar() {
  clearTimeout(sidebarHideTimeout);
  els.sidebar.classList.add("revealed");
}
function scheduleHideSidebar() {
  clearTimeout(sidebarHideTimeout);
  sidebarHideTimeout = setTimeout(() => els.sidebar.classList.remove("revealed"), 400);
}
els.sidebarHoverZone.addEventListener("mouseenter", revealSidebar);
els.sidebarHoverZone.addEventListener("mouseleave", scheduleHideSidebar);
els.sidebar.addEventListener("mouseenter", revealSidebar);
els.sidebar.addEventListener("mouseleave", scheduleHideSidebar);

els.refresh.addEventListener("click", () => signaling.requestSessionList());

// If the HTTP/MJPEG stream errors out (network blip, server restart)
// while it's the active transport, reopen it after a short delay. The
// WebRTC path has its own recovery via RemoteSession.onConnectionLost;
// this is the equivalent for the fallback, which is just an <img> and
// won't retry a dead multipart response on its own.
els.screenHttp.addEventListener("error", () => {
  if (transportMode === "http" && currentSession) {
    setTimeout(() => {
      if (transportMode === "http" && currentSession) reconnectActiveSession();
    }, 1000);
  }
});

els.shotBtn.addEventListener("click", () => {
  if (currentSession) signaling.requestScreenshot(currentSession.session_id);
});

// connectWebRTC (re)establishes the WebRTC PeerConnection for the current
// session. It is shared by openSession and switchTransport("webrtc") to
// avoid duplicating the fetchIceServers → RemoteSession → connect-timeout
// sequence. Each call captures a generation token; if transportGeneration
// or transportMode has moved on by the time the async ICE-server fetch
// resolves (e.g. the user switched to HTTP mid-flight), this becomes a
// no-op instead of clobbering the newer state with a stale connection.
async function connectWebRTC() {
  const myGeneration = ++transportGeneration;
  gotFirstFrame = false;
  setStatus("connecting…", "");
  clearTimeout(connectTimeoutHandle);

  const iceServers = await fetchIceServers();
  if (myGeneration !== transportGeneration || transportMode !== "webrtc") return;

  remote = new RemoteSession(signaling, currentSession, renderScreenFrame, iceServers);
  remote.onConnectionLost = () => {
    // Only recover if this is still the active session on the WebRTC
    // transport — not a stale peer whose failure raced a manual switch.
    if (myGeneration === transportGeneration && transportMode === "webrtc" && currentSession) {
      setStatus("⚠ соединение потеряно, переподключение…", "failed");
      reconnectActiveSession();
    }
  };
  remote.connect();
  connectTimeoutHandle = setTimeout(() => {
    if (myGeneration !== transportGeneration) return;
    if (!gotFirstFrame) {
      setStatus("⚠ WebRTC timed out — switching to HTTP", "failed");
      switchTransport("http");
    }
  }, WEBRTC_CONNECT_TIMEOUT_MS);
}

async function openSession(session) {
  currentSession = session;
  transportMode = "webrtc";
  els.headerTitle.textContent = session.name;
  els.back.hidden = false;
  els.listView.hidden = true;
  els.controlView.hidden = false;
  els.mouseToggle.checked = false;
  els.kbToggle.checked = false;

  await connectWebRTC();
}

// switchTransport tears down/creates the resources for the given
// transport and flips which surface element (canvas vs <img>) is visible.
// Called both automatically (connect timeout) and manually (toolbar
// toggle button).
function switchTransport(mode) {
  if (!currentSession) return;
  transportGeneration++; // invalidate any in-flight connectWebRTC() from a previous call
  transportMode = mode;
  if (mode === "http") {
    if (remote) { remote.close(); remote = null; }
    clearTimeout(connectTimeoutHandle);
    els.screen.hidden = true;
    els.screenHttp.hidden = false;
    els.screenHttp.src = "/stream/" + currentSession.session_id;
    setStatus("🟠 HTTP relay", "");
    els.transportToggle.textContent = "⇄ WebRTC";
  } else {
    els.screenHttp.src = "";
    els.screenHttp.hidden = true;
    els.screen.hidden = false;
    els.transportToggle.textContent = "⇄ HTTP";
    connectWebRTC();
  }
}

els.transportToggle.addEventListener("click", () => {
  switchTransport(transportMode === "webrtc" ? "http" : "webrtc");
});

els.back.addEventListener("click", () => {
  transportGeneration++; // invalidate any in-flight connectWebRTC()
  clearTimeout(connectTimeoutHandle);
  if (remote) { remote.close(); remote = null; }
  currentSession = null;
  transportMode = "webrtc";
  els.screenHttp.src = "";
  els.screenHttp.hidden = true;
  els.screen.hidden = false;
  els.back.hidden = true;
  els.listView.hidden = false;
  els.controlView.hidden = true;
  els.controlView.classList.remove("expanded");
  els.sidebar.classList.remove("revealed");
  clearTimeout(sidebarHideTimeout);
  els.expandBtn.textContent = "⛶ Expand";
  els.headerTitle.textContent = "RDP-Tool — Sessions";
});

// renderScreenFrame takes the raw reassembled JPEG bytes (a Uint8Array,
// not base64 — chunking sends the bytes directly, no JSON/base64
// overhead) and draws them onto the canvas.
function renderScreenFrame(jpegBytes) {
  if (!gotFirstFrame) {
    gotFirstFrame = true;
    clearTimeout(connectTimeoutHandle);
    setStatus("🟢 live (WebRTC)", "live");
  }
  const url = URL.createObjectURL(new Blob([jpegBytes], { type: "image/jpeg" }));
  const img = new Image();
  img.onload = () => {
    if (els.screen.width !== img.width || els.screen.height !== img.height) {
      els.screen.width = img.width;
      els.screen.height = img.height;
    }
    els.screen.getContext("2d").drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
  };
  img.onerror = () => URL.revokeObjectURL(url);
  img.src = url;
}

// ---------- Mouse control ----------

els.mouseToggle.addEventListener("change", () => { /* checkbox is the source of truth, read directly */ });

// wireMouseControl is attached to both the canvas (WebRTC) and the <img>
// (HTTP fallback) surfaces. Only one is ever visible at a time — the
// hidden one doesn't receive real pointer events — so there's no need to
// gate on transportMode here; activeSurfaceSize()/sendInput() already
// route to whichever transport is live.
function wireMouseControl(el) {
  el.addEventListener("mousemove", (e) => {
    if (!els.mouseToggle.checked || !currentSession) return;
    const rect = el.getBoundingClientRect();
    const size = activeSurfaceSize();
    if (size.width <= 0 || size.height <= 0) return;
    const x = Math.round(((e.clientX - rect.left) / rect.width) * size.width);
    const y = Math.round(((e.clientY - rect.top) / rect.height) * size.height);
    sendInput("mouse_move", { x, y });
  });
  el.addEventListener("mousedown", () => {
    if (!els.mouseToggle.checked || !currentSession) return;
    sendInput("mouse_down", {});
  });
  el.addEventListener("mouseup", () => {
    if (!els.mouseToggle.checked || !currentSession) return;
    sendInput("mouse_up", {});
  });
  el.addEventListener("contextmenu", (e) => e.preventDefault());
  // <img> is natively draggable in every browser — holding the mouse
  // button down and moving starts a native "drag this image" gesture
  // instead of a remote mouse-down-drag, fighting anything on the host
  // that expects a held button (selection, window drag, sliders). The
  // draggable="false" attribute on #screen-http covers most cases;
  // this is a defense-in-depth backstop for browsers/situations where
  // that alone isn't enough. Canvas isn't draggable by default, so this
  // is a no-op there.
  el.addEventListener("dragstart", (e) => e.preventDefault());
}
wireMouseControl(els.screen);
wireMouseControl(els.screenHttp);

// ---------- Keyboard control + hotkeys + rebind ----------

els.mouseRebind.addEventListener("click", () => { rebinding = "mouse"; els.mouseRebind.textContent = "Press keys..."; });
els.kbRebind.addEventListener("click", () => { rebinding = "keyboard"; els.kbRebind.textContent = "Press keys..."; });

function isTypingTarget(el) {
  return el && (el.id === "msg-text" || el.id === "msg-fade");
}

document.addEventListener("keydown", (e) => {
  if (rebinding) {
    if (MODIFIER_CODES.has(e.code)) return; // wait for a real, non-modifier key
    e.preventDefault();
    const combo = comboFromEvent(e);
    if (rebinding === "mouse") { mouseCombo = combo; saveCombo("rdp.mouseCombo", combo); els.mouseRebind.textContent = "Rebind"; }
    else { kbCombo = combo; saveCombo("rdp.kbCombo", combo); els.kbRebind.textContent = "Rebind"; }
    updateHotkeyLabels();
    rebinding = null;
    return;
  }

  if (isTypingTarget(document.activeElement)) return;

  const combo = comboFromEvent(e);
  if (!MODIFIER_CODES.has(e.code) && comboEquals(combo, mouseCombo)) {
    e.preventDefault();
    els.mouseToggle.checked = !els.mouseToggle.checked;
    return;
  }
  if (!MODIFIER_CODES.has(e.code) && comboEquals(combo, kbCombo)) {
    e.preventDefault();
    els.kbToggle.checked = !els.kbToggle.checked;
    return;
  }

  if (els.kbToggle.checked && currentSession) {
    const vk = CODE_TO_VK[e.code];
    if (vk) {
      e.preventDefault();
      sendInput("key_down", { key_vk: vk });
    }
  }
});

document.addEventListener("keyup", (e) => {
  if (rebinding || isTypingTarget(document.activeElement)) return;
  if (els.kbToggle.checked && currentSession) {
    const vk = CODE_TO_VK[e.code];
    if (vk) sendInput("key_up", { key_vk: vk });
  }
});

// ---------- Overlay message ----------

els.msgSend.addEventListener("click", () => {
  if (!currentSession) return;
  const text = els.msgText.value;
  if (!text) return;
  let fade = parseFloat(els.msgFade.value);
  if (isNaN(fade) || fade <= 0) fade = 2.0;
  fade = Math.round(fade * 10) / 10;
  const color = els.msgColor.value; // native <input type=color> is always "#rrggbb"
  if (transportMode === "webrtc") {
    if (remote) remote.send(FRAME_OVERLAY_MESSAGE, { text, fade_seconds: fade, color });
  } else {
    signaling.sendOverlayMessage(currentSession.session_id, { text, fade_seconds: fade, color });
  }
  els.msgText.value = "";
});
</script>
</body>
</html>
